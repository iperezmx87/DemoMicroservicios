services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"   # Puerto expuesto para tu máquina local (Host)
      - "9093:9093"   # Puerto del controlador (interno/externo si se requiere)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      
      # 1. Definimos 3 oyentes: Uno interno (INTERNAL), uno externo (EXTERNAL) y el del controlador
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      
      # 2. Esta es la clave. Mapeamos cómo deben buscar a Kafka desde afuera y desde adentro
      # - Los otros contenedores usarán el nombre del servicio 'kafka' en el puerto 29092
      # - Tu máquina local usará 'localhost' en el puerto 9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      
      # 3. Mapeamos los protocolos de seguridad para cada listener
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      
      # 4. Definimos qué listener se usará para la comunicación interna entre brokers (si escalaras el clúster)
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
      
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: banco-observabilidad-jaeger
    ports:
      - "16686:16686" # Mantenemos este para que abras la UI en tu navegador (http://localhost:16686)
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: banco-observabilidad-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      # Usamos ${PWD} para asegurar que busque el archivo en tu directorio actual
      - ${PWD}/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "8888:8888"
    depends_on:
      - jaeger

volumes:
  kafka-data: